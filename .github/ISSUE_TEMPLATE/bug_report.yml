name: Bug Report
description: Something isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.
        **Do not paste real customer data, org domains, secrets, or production agent transcripts.** Redact before submitting.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands or steps to reproduce the issue (redact any sensitive values).
      placeholder: |
        1. Run `agentforce-probe run --spec ...`
        2. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Actual output / error message
      description: Paste the full error output here (redact secrets).
      render: text

  - type: dropdown
    id: path
    attributes:
      label: Which path?
      options:
        - External Copilot (Testing Center / sf agent test)
        - Internal Copilot (headless Agent API)
        - Judge (Claude Code handoff)
        - Judge (API-key fallback)
        - doctor / setup
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: agentforce-probe version
      description: Run `pip show agentforce-probe`
    validations:
      required: true

  - type: dropdown
    id: python
    attributes:
      label: Python version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant.
