# Pre-commit gate for agentforce-probe.
#
# All hooks are `repo: local` on purpose: they invoke tools already in the dev
# environment (no external hook repos to download), so the gate works offline
# and matches CI exactly. Install once with:  pre-commit install
#
# The same checks run in CI (.github/workflows/ci.yml), so a green local commit
# means a green pipeline.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: privacy-scan
        name: privacy & hygiene scan (secrets / customer data / agent footprints)
        entry: bash scripts/check-secrets.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff lint
        entry: ruff check src/ tests/
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: ruff format check
        entry: ruff format --check src/ tests/
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest-cov
        name: pytest + 100% coverage gate
        entry: pytest tests/ -q --cov=agentforce_probe --cov-report=term-missing --cov-fail-under=100
        language: system
        pass_filenames: false
        stages: [pre-push]
