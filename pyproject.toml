[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforce-probe"
version = "0.1.0"
description = "Run automated tests against Salesforce Agentforce agents (External + Internal Copilot) and score them into evidence — fully local, privacy-first, no API key required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ray Kuo" },
]
keywords = [
    "salesforce", "agentforce", "testing", "qa", "evaluation",
    "llm", "agent", "copilot", "llm-as-judge",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=5.1",
]

[project.urls]
Homepage = "https://github.com/raykuo/agentforce-probe"
Repository = "https://github.com/raykuo/agentforce-probe"
"Bug Tracker" = "https://github.com/raykuo/agentforce-probe/issues"
Changelog = "https://github.com/raykuo/agentforce-probe/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "pip-audit>=2.7"]

[project.scripts]
agentforce-probe = "agentforce_probe.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line-length handled by formatter
    "E702",  # multiple statements on one line (semicolons) — used in compact arg-parsing loops
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
