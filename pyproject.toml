[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforce-probe"
version = "0.1.0"
description = "Local, privacy-first CLI to run automated tests against Salesforce Agentforce agents (External + Internal Copilot) and score them into evidence."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ray Kuo" }]
keywords = [
    "salesforce",
    "agentforce",
    "testing",
    "llm",
    "agent",
    "copilot",
    "qa",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/OWNER/agentforce-probe"
Issues = "https://github.com/OWNER/agentforce-probe/issues"

[project.scripts]
agentforce-probe = "agentforce_probe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforce_probe"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
